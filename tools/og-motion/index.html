<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OG motion</title>
    <style>
      body { margin: 0; padding: 24px; background: #2a2a2e; color: #fff; font: 14px system-ui, sans-serif; }
      canvas { display: block; width: 600px; max-width: 100%; border-radius: 8px; }
      p { opacity: 0.7; }
    </style>
  </head>
  <body>
    <!-- Dev-only tool (not part of the app build): previews the animated thumbnail and exports
         it as a GIF. Run with the Vite dev server at /tools/og-motion/. -->
    <canvas id="preview" width="1200" height="630"></canvas>
    <p id="status">Looping preview</p>
    <script type="module">
      import { draw, W, H, T } from "./motion.js";
      import { exportGif } from "./export.js";
      const canvas = document.getElementById("preview");
      const ctx = canvas.getContext("2d");
      const loop = T.end + T.hold;
      const start = performance.now();
      function frame(now) {
        draw(ctx, (now - start) % loop);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      window.exportGif = exportGif;
      window.renderAt = (t) => draw(ctx, t);
    </script>
  </body>
</html>
